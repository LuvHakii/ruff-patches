id: printer-markers
language: rust
files: [crates/ruff_formatter/src/printer/mod.rs]
metadata: { expect: 1 }
rule:
  pattern: |
    {
        let text = slice.text(self.source_code);
        $$$BODY
    }
  inside: { kind: match_arm, has: { field: pattern, regex: ^FormatElement::SourceCodeSlice } }
fix: |-
  {
      let text = slice.text(self.source_code);
      let r = ruff_text_size::Ranged::range(slice);
      self.state.source_markers.push(SourceMarker { source: r.start(), dest: self.state.buffer.text_len() });
      $$$BODY
      self.state.source_markers.push(SourceMarker { source: r.end(), dest: self.state.buffer.text_len() });
  }
---
