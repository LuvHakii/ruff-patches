name: build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish release <yyyymmdd-hhmm> UTC. Off = dry run, artifact only, 7 days."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: apply patches
        run: |
          out=$(git -C ruff apply -v $PWD/patches/*.patch 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          ! grep -q offset <<<"$out"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rust-src-dir: ruff
          target: wasm32-unknown-unknown
      - name: install wasm-pack
        run: curl -fsSL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz | sudo tar xz -C /usr/local/bin --strip-components=1 --wildcards '*/wasm-pack'
      - name: build
        run: wasm-pack build ruff/crates/ruff_wasm --target web --release --out-dir $PWD/out
      - name: versions
        run: |
          SHA=$(git rev-parse HEAD:ruff)
          TAG=$(git ls-remote --tags https://github.com/astral-sh/ruff.git | grep "^$SHA" | cut -f2 | sed 's|refs/tags/||; s|\^{}$||' | tail -1 || true)
          echo "{\"ruffRev\":\"${TAG:-$SHA}\",\"ruffCommit\":\"$SHA\"}" > out/versions.json
      - name: upload dry run
        if: '!inputs.release'
        uses: actions/upload-artifact@v4
        with:
          name: ruff-patches-dryrun-${{ github.sha }}
          path: |
            out/*.wasm
            out/*.js
            out/*.d.ts
            out/versions.json
          retention-days: 7
      - name: release
        if: inputs.release
        run: gh release create "$(date -u +%Y%m%d-%H%M)" out/*.{wasm,js,d.ts} out/versions.json --notes ""
